name: Build APK

on:
  push:
    paths-ignore:
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/build.log

      - name: Publish APK to builds branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir /tmp/out
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/BusWaze.apk
          cd /tmp/out
          git init -b builds
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add BusWaze.apk
          git commit -m "APK build ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" builds

      - name: Publish build log on failure
        if: failure()
        run: |
          mkdir /tmp/faillog
          cp /tmp/build.log /tmp/faillog/build.log 2>/dev/null || echo "no gradle log captured" > /tmp/faillog/build.log
          cd /tmp/faillog
          git init -b buildlog
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add build.log
          git commit -m "Build failure log ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" buildlog
